<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Arknights Analytical Engine{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=3">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div class="logo">
            <h1>ARKNIGHTS <span class="text-accent">ANALYTICS</span> <span style="font-size: 0.55em; background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 4px; padding: 2px 6px; vertical-align: middle; margin-left: 8px;">v1.0</span></h1>
        </div>
        <nav>
            <a href="/">DASHBOARD</a>
            <a href="/tierlist">TIER LIST</a>
            <a href="/enemy_tierlist">ENEMY TIER LIST</a>
            <a href="/editor">OPERATOR EDITOR</a>
            <a href="/enemy_editor">ENEMY EDITOR</a>
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
