{% extends "base.html" %}

{% block title %}Enemy Tier List - Arknights Analytics{% endblock %}

{% block content %}
<style>
.enemy-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, border-color 0.15s ease;
}
.enemy-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent-primary);
}
.enemy-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
}
.enemy-badge.boss {
    background: rgba(239, 68, 68, 0.25);
    color: #f87171;
    border: 1px solid #ef4444;
}
.enemy-badge.elite {
    background: rgba(234, 179, 8, 0.25);
    color: #facc15;
    border: 1px solid #eab308;
}
.enemy-badge.normal {
    background: rgba(59, 130, 246, 0.25);
    color: #60a5fa;
    border: 1px solid #3b82f6;
}
.enemy-name {
    font-weight: 700;
    font-size: 0.92rem;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.enemy-id {
    font-size: 0.7rem;
    color: var(--text-secondary);
    font-family: monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.threat-score-pill {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.4);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    border-left: 3px solid var(--accent-primary);
}
.threat-score-val {
    font-weight: 800;
    color: #38bdf8;
    font-size: 0.9rem;
}
.stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    font-size: 0.75rem;
    background: rgba(255,255,255,0.02);
    padding: 6px;
    border-radius: 4px;
}
.stat-item {
    display: flex;
    justify-content: space-between;
    color: #bbb;
}
.stat-item span {
    font-weight: 700;
    color: #fff;
}
.immunity-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    min-height: 18px;
}
.imm-tag {
    font-size: 0.6rem;
    padding: 1px 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.08);
    color: #bbb;
}
.imm-tag.active {
    background: rgba(244, 63, 94, 0.2);
    color: #fb7185;
    border: 1px solid rgba(244, 63, 94, 0.4);
}
.tier-row {
    display: flex;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
}
.tier-label {
    width: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 900;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    flex-shrink: 0;
}
.tier-OP { background: #dc2626; color: white; }
.tier-S { background: #ea580c; color: white; }
.tier-A { background: #d97706; color: white; }
.tier-B { background: #65a30d; color: white; }
.tier-C { background: #059669; color: white; }
.tier-D { background: #0891b2; color: white; }
.tier-E { background: #4f46e5; color: white; }
.tier-F { background: #475569; color: #cbd5e1; }

.tier-content {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
    flex: 1;
}
</style>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 20px;">
        <h2>ENEMY THREAT TIER LIST <span id="enemy-count-span" style="font-size: 1rem; color: var(--text-secondary); font-weight: normal;"></span></h2>
        <div style="flex: 1; max-width: 600px; display: flex; gap: 10px; align-items: center;">
            <input type="text" id="enemy-search" placeholder="Search enemy name or ID..." style="flex: 1;">
            <button id="export-enemy-csv" class="secondary">EXPORT CSV</button>
            <button id="export-enemy-csv-all" class="secondary" title="One CSV with all threat classes (All/Boss/Elite/Normal)">EXPORT ALL CATEGORIES</button>
            <button id="refresh-enemy-tierlist" class="primary">REFRESH</button>
        </div>
    </div>

    <div style="margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; gap: 20px; align-items: center;">
        <div style="display: flex; gap: 10px; align-items: center;">
            <label for="enemy-category-filter" style="font-weight: bold; color: #38bdf8;">CATEGORY:</label>
            <select id="enemy-category-filter" style="padding: 8px 12px; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--border); border-radius: 4px;">
                <option value="all">All Threat Classes</option>
                <option value="boss">Bosses Only</option>
                <option value="elite">Elites Only</option>
                <option value="normal">Normals Only</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px; align-items: center;">
            <label for="enemy-metric-filter" style="font-weight: bold; color: var(--accent-primary);">RANK BY:</label>
            <select id="enemy-metric-filter" style="padding: 8px 12px; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--border); border-radius: 4px;">
                <option value="threat_score">Overall Threat Score (EHP x DPS x Multipliers)</option>
                <option value="hp">Max Health (HP)</option>
                <option value="ehp">Effective HP (EHP)</option>
                <option value="dps">Damage Per Second (DPS)</option>
                <option value="atk">Raw Attack (ATK)</option>
                <option value="def">Defense (DEF)</option>
                <option value="res">Arts Resistance (RES)</option>
                <option value="weight">Weight Level</option>
            </select>
        </div>
    </div>

    <div id="enemy-tierlist-container">
        <div style="padding: 3rem; text-align: center; color: var(--text-secondary);">
            Loading enemy combat data...
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let rawEnemyData = [];
    let currentCategory = 'all';
    let currentMetric = 'threat_score';

    async function loadEnemyTierlist() {
        const btn = document.getElementById('refresh-enemy-tierlist');
        btn.innerText = 'LOADING...';
        btn.disabled = true;

        try {
            const cat = document.getElementById('enemy-category-filter').value;
            const res = await fetch(`/api/enemy_tierlist_data?category=${encodeURIComponent(cat)}`);
            const data = await res.json();
            if (res.ok) {
                rawEnemyData = data.enemies || [];
                renderEnemyTierlist();
            } else {
                alert("Failed to load enemy data: " + (data.detail || "Server error"));
            }
        } catch (e) {
            console.error(e);
        } finally {
            btn.innerText = 'REFRESH';
            btn.disabled = false;
        }
    }

    document.getElementById('refresh-enemy-tierlist').addEventListener('click', loadEnemyTierlist);
    document.getElementById('export-enemy-csv').addEventListener('click', () => {
        const cat = document.getElementById('enemy-category-filter').value;
        window.location.href = `/api/enemy_tierlist/export?category=${encodeURIComponent(cat)}`;
    });
    document.getElementById('export-enemy-csv-all').addEventListener('click', () => {
        window.location.href = '/api/enemy_tierlist/export_all';
    });
    document.getElementById('enemy-category-filter').addEventListener('change', loadEnemyTierlist);
    document.getElementById('enemy-metric-filter').addEventListener('change', (e) => {
        currentMetric = e.target.value;
        renderEnemyTierlist();
    });
    document.getElementById('enemy-search').addEventListener('input', renderEnemyTierlist);

    function renderEnemyTierlist() {
        const term = document.getElementById('enemy-search').value.toLowerCase();
        let list = [...rawEnemyData];

        if (term) {
            list = list.filter(e => (e.name && e.name.toLowerCase().includes(term)) || (e.id && e.id.toLowerCase().includes(term)));
        }

        // Sort by chosen metric descending
        list.sort((a, b) => {
            const va = a[currentMetric] || 0;
            const vb = b[currentMetric] || 0;
            return vb - va;
        });

        // Dynamic tier recalculation among filtered results
        const n = list.length;
        list.forEach((e, idx) => {
            const pct = (idx + 1) / (n || 1);
            if (pct <= 0.03) e.ranking_tier = 'OP';
            else if (pct <= 0.12) e.ranking_tier = 'S';
            else if (pct <= 0.28) e.ranking_tier = 'A';
            else if (pct <= 0.50) e.ranking_tier = 'B';
            else if (pct <= 0.72) e.ranking_tier = 'C';
            else if (pct <= 0.86) e.ranking_tier = 'D';
            else if (pct <= 0.95) e.ranking_tier = 'E';
            else e.ranking_tier = 'F';
        });

        document.getElementById('enemy-count-span').innerText = `(${n} Enemies)`;

        const container = document.getElementById('enemy-tierlist-container');
        if (n === 0) {
            container.innerHTML = '<div style="padding: 3rem; text-align: center; color: var(--text-secondary);">No enemies found matching your filters.</div>';
            return;
        }

        const tiers = ['OP', 'S', 'A', 'B', 'C', 'D', 'E', 'F'];
        let html = '';

        tiers.forEach(t => {
            const enemiesInTier = list.filter(e => (e.ranking_tier || e.tier) === t);
            if (enemiesInTier.length > 0) {
                html += `
                    <div class="tier-row">
                        <div class="tier-label tier-${t}">${t}</div>
                        <div class="tier-content">
                            ${enemiesInTier.map(e => {
                                const bType = (e.tier_type || e.category || 'NORMAL').toUpperCase();
                                const bClass = bType.toLowerCase();
                                const immStun = e.immune_stun ? '<span class="imm-tag active">STUN IMM</span>' : '';
                                const immSilence = e.immune_silence ? '<span class="imm-tag active">SILENCE IMM</span>' : '';
                                const immFreeze = e.immune_freeze ? '<span class="imm-tag active">FREEZE IMM</span>' : '';
                                const immSleep = e.immune_sleep ? '<span class="imm-tag active">SLEEP IMM</span>' : '';
                                const immLev = e.immune_levitate ? '<span class="imm-tag active">LEVITATE IMM</span>' : '';
                                
                                return `
                                    <div class="enemy-card">
                                        <span class="enemy-badge ${bClass}">${bType}</span>
                                        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 2px;">
                                            <img src="/static/images/enemies/${e.id}.png" 
                                                 onerror="if(!this.dataset.triedCdn){this.dataset.triedCdn='1'; this.src='https://cdn.jsdelivr.net/gh/fexli/ArknightsResource@main/enemy/' + encodeURIComponent('${e.id}') + '.png';} else {this.onerror=null; this.src='/static/images/placeholder.webp';}" 
                                                 alt="${e.name}" 
                                                 style="width: 48px; height: 48px; border-radius: 6px; background: rgba(0,0,0,0.4); object-fit: contain; border: 1px solid var(--border); flex-shrink: 0;">
                                            <div style="flex: 1; min-width: 0; padding-right: 35px;">
                                                <div class="enemy-name" title="${e.name}">${e.name}</div>
                                                <div class="enemy-id" title="${e.id}">${e.id}</div>
                                            </div>
                                        </div>
                                        
                                        <div class="threat-score-pill">
                                            <span>THREAT LEVEL</span>
                                            <span class="threat-score-val">${Math.round(e.threat_score || 0).toLocaleString()}</span>
                                        </div>

                                        <div class="stat-grid">
                                            <div class="stat-item">HP: <span>${Math.round(e.hp || 0).toLocaleString()}</span></div>
                                            <div class="stat-item">ATK: <span>${Math.round(e.atk || 0)}</span></div>
                                            <div class="stat-item">DEF: <span>${Math.round(e.def || 0)}</span></div>
                                            <div class="stat-item">RES: <span>${Math.round(e.res || 0)}</span></div>
                                            <div class="stat-item">INT: <span>${(e.attack_interval || 0).toFixed(1)}s</span></div>
                                            <div class="stat-item">WGT: <span>${e.weight || 0}</span></div>
                                        </div>

                                        <div class="immunity-row">
                                            ${immStun}
                                            ${immSilence}
                                            ${immFreeze}
                                            ${immSleep}
                                            ${immLev}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
        });

        container.innerHTML = html;
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', loadEnemyTierlist);
</script>
{% endblock %}
